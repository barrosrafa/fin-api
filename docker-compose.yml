services:
  api:
    build: .
    command: python -m app.cli serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-test_jwt_secret}
      - ASAAS_API_KEY=${ASAAS_API_KEY:-test_asaas_key}
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: python -m app.cli worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-test_jwt_secret}
      - ASAAS_API_KEY=${ASAAS_API_KEY:-test_asaas_key}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
